# Render Blueprint for the CSA backend.
# Deploy: push this repo to GitHub, then in Render use "New -> Blueprint"
# and select the repo. Render reads this file, deploys the backend, and
# prompts you to fill in the secret env vars (sync: false) on first deploy.
#
# The attendance app (attendanceApp) then talks to the URL Render assigns,
# e.g. https://csa-backend.onrender.com/api/v1
services:
  - type: web
    name: csa-backend
    runtime: node
    plan: free
    rootDir: backEnd
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # Comma-separated list of allowed origins, e.g.
      # http://localhost:5173,https://church-website-olive-eta.vercel.app,https://csa-attendance.vercel.app
      - key: CORS_ORIGIN
        sync: false

      - key: FRONTEND_URL
        sync: false

      # Aiven Postgres
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_ALLOW_SELF_SIGNED
        value: "true"

      # MongoDB Atlas
      - key: MONGODB_URI
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false

      # Groq (AI questions / chatbot)
      - key: GROQ_API_KEY
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # M-Pesa
      - key: CONSUMER_KEY
        sync: false
      - key: CONSUMER_SECRET
        sync: false
      - key: SHORTCODE
        sync: false
      - key: PASSKEY
        sync: false
      - key: CALLBACK_URL
        sync: false

      # Email
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
