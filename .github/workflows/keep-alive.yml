name: Keep Render alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoints
        run: |
          set +e
          for url in https://church-website-q8z9.onrender.com/health https://csakyu.com/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            echo "$url -> HTTP $code"
          done
